<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RR Appliances Time Clock</title>
<style>
  :root { --bg:#f4f6f8; --card:#ffffff; --ink:#1b1f24; --muted:#5f6b76;
          --green:#1e8e3e; --red:#c5221f; --blue:#1f4e79; --amber:#b06000; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
         background:var(--bg); color:var(--ink); }
  .wrap { max-width:460px; margin:0 auto; padding:24px 16px; }
  .brand { text-align:center; font-weight:700; letter-spacing:.5px; color:var(--blue); margin-bottom:16px; }
  .card { background:var(--card); border-radius:16px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.08); text-align:center; }
  h1 { font-size:28px; margin:0 0 6px; }
  .status { font-size:17px; color:var(--muted); min-height:24px; margin-bottom:6px; }
  .state { display:inline-block; padding:6px 14px; border-radius:999px; font-weight:700; margin:8px 0 18px; }
  .state.in  { background:#e6f4ea; color:var(--green); }
  .state.out { background:#eceff1; color:var(--muted); }
  button { width:100%; border:0; border-radius:14px; padding:22px; font-size:24px; font-weight:800;
           color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; }
  #inBtn  { background:var(--green); }
  #outBtn { background:var(--red); }
  #retryBtn { background:var(--blue); font-size:18px; padding:14px; margin-top:12px; }
  .result { margin-top:18px; font-size:20px; font-weight:700; min-height:28px; }
  .ok  { color:var(--green); }
  .bad { color:var(--red); }
  .clock { font-size:15px; color:var(--muted); margin-top:18px; }
  .note { color:var(--amber); }
  .hidden { display:none; }
  #saved { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
           color:#fff; text-align:center; padding:24px; z-index:10; }
  #saved.in  { background:var(--green); }
  #saved.out { background:var(--blue); }
  #saved .big { font-size:64px; font-weight:900; line-height:1; }
  #saved .what { font-size:30px; font-weight:800; margin-top:18px; }
  #saved .who { font-size:22px; margin-top:10px; opacity:.95; }
  #saved .tap { font-size:16px; margin-top:36px; opacity:.85; }
</style>
</head>
<body>
<div id="saved" class="hidden">
  <div class="big">✓ SAVED</div>
  <div class="what" id="savedWhat"></div>
  <div class="who" id="savedWho"></div>
  <div class="tap">You can close this page. Tap anywhere to go back.</div>
</div>
<div class="wrap">
  <div class="brand">RR APPLIANCES TIME CLOCK</div>
  <div class="card">
    <h1 id="name">Loading…</h1>
    <div id="state" class="state hidden"></div>
    <div id="status" class="status">Checking your location…</div>
    <button id="inBtn" class="hidden">CLOCK IN</button>
    <button id="outBtn" class="hidden">CLOCK OUT</button>
    <button id="retryBtn" class="hidden">Check location again</button>
    <div id="result" class="result"></div>
    <div id="clock" class="clock"></div>
  </div>
</div>

<script>
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzodFkizs9UZVwyd4zNR4JZvntbYTT_kUToe4PVri-RV78cLkaYMh9huRtXVOeP96pm/exec";
  var SHARED_SECRET = "RRA-TimeClock-v2-Carlisle-9fK3";   // must match Code.gs
  var SHOP_LAT = 39.583183952335524;
  var SHOP_LNG = -84.29284007312326;
  var RADIUS_FT = 150;

  var id = new URLSearchParams(window.location.search).get("id");
  var pos = null, onClock = null, busy = false;
  var $ = function (x) { return document.getElementById(x); };

  setInterval(function () {
    $("clock").textContent = new Date().toLocaleString([], { weekday:"long", hour:"numeric", minute:"2-digit" });
  }, 1000);

  function distanceFt(a, b, c, d) {
    var R = 20902231, r = function (x) { return x * Math.PI / 180; };
    var dLat = r(c - a), dLng = r(d - b);
    var h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLng/2)*Math.sin(dLng/2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function post(body) {
    body.secret = SHARED_SECRET;
    body.id = id;
    return fetch(APPS_SCRIPT_URL, { method:"POST", body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }

  function showState() {
    var s = $("state");
    s.classList.remove("hidden", "in", "out");
    if (onClock) { s.classList.add("in"); s.textContent = "ON THE CLOCK" + (window._since ? " since " + window._since : ""); }
    else { s.classList.add("out"); s.textContent = "NOT CLOCKED IN"; }
    updateButtons();
  }

  function updateButtons() {
    var ready = pos && onClock !== null && !busy;
    $("inBtn").classList.toggle("hidden", !(ready && !onClock));
    $("outBtn").classList.toggle("hidden", !(ready && onClock));
  }

  function checkLocation() {
    $("retryBtn").classList.add("hidden");
    $("status").textContent = "Checking your location…";
    if (!navigator.geolocation) { $("status").textContent = "This phone can't share location."; return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      var dist = Math.round(distanceFt(p.coords.latitude, p.coords.longitude, SHOP_LAT, SHOP_LNG));
      if (dist <= RADIUS_FT) {
        pos = p;
        $("status").textContent = "You're at the store ✓";
      } else {
        pos = null;
        $("status").textContent = "You're about " + dist + " ft away. You have to be at the store.";
        $("retryBtn").classList.remove("hidden");
      }
      updateButtons();
    }, function () {
      $("status").textContent = "Location is required. Allow location access, then tap below.";
      $("retryBtn").classList.remove("hidden");
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }

  function punch(action) {
    if (busy || !pos) return;
    busy = true; updateButtons();
    $("result").className = "result";
    $("result").textContent = "Saving… please wait, don't tap again";
    post({ action: action, lat: pos.coords.latitude, lng: pos.coords.longitude,
           accuracyFt: pos.coords.accuracy * 3.28084 })
      .then(function (d) {
        if (typeof d.onClock === "boolean") { onClock = d.onClock; window._since = d.since || ""; }
        if (d.ok) {
          $("result").className = "result ok";
          $("result").textContent = "✓ " + d.message;
          $("saved").className = d.onClock ? "in" : "out";
          $("savedWhat").textContent = (d.verb || action.toUpperCase()) + " at " + (d.time || "");
          $("savedWho").textContent = d.name || "";
        } else {
          $("result").className = "result " + (d.notice ? "note" : "bad");
          $("result").textContent = d.message;
        }
      })
      .catch(function () {
        $("result").className = "result bad";
        $("result").textContent = "Couldn't reach the time clock. Check your signal and refresh this page to see if it saved.";
      })
      .then(function () { busy = false; showState(); });
  }

  $("inBtn").onclick = function () { punch("Clock In"); };
  $("outBtn").onclick = function () { punch("Clock Out"); };
  $("retryBtn").onclick = checkLocation;
  $("saved").onclick = function () { $("saved").className = "hidden"; };

  if (!id) {
    $("name").textContent = "Scan your QR code";
    $("status").textContent = "Use your personal QR code at the store to clock in or out.";
  } else {
    post({ action: "status" }).then(function (d) {
      if (!d.ok) { $("name").textContent = "Not set up"; $("status").textContent = d.message; return; }
      $("name").textContent = d.name;
      onClock = d.onClock; window._since = d.since || "";
      showState();
      checkLocation();
    }).catch(function () {
      $("name").textContent = "Can't connect";
      $("status").textContent = "Couldn't reach the time clock. Check your signal and refresh.";
    });
  }
</script>
</body>
</html>
